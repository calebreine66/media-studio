name: Desktop app checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - name: Install the app and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check media_studio tests main.py
      - name: Test with real FFmpeg
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
