[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "media-studio"
version = "0.1.0"
description = "A native, capability-aware FFmpeg multimedia converter and compressor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11"]

[project.gui-scripts]
media-studio = "media_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["media_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: executes installed FFmpeg and FFprobe"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
